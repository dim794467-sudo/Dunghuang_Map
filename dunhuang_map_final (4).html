  goffman: {
    'FRONT': 'Передний план (front region) — поведение, ориентированное на аудиторию и управление впечатлениями (Goffman, 1959, <i>The Presentation of Self in Everyday Life</i>, ch. 3).',
    'BACK': 'Задний план (back region) — регион, где представление может быть приостановлено или где происходит подготовка (Goffman, 1959, <i>The Presentation of Self in Everyday Life</i>, ch. 3).'
  }
};

// 2-hour slots by time of day only (minutes)
const slots = [0, 7*60, 9*60, 11*60, 13*60, 15*60, 17*60];
const slider = document.getElementById('slider');
slider.max = slots.length - 1;

let mode = 'bourdieu';
let layer = null;
let chart = null;

function getWindow() {
  const i = +slider.value;
  if (i === 0) return null;
  const start = slots[i];
  return [start, start + 120];
}

function fmt(min) {
  const h = Math.floor(min/60), m = min%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}

function update() {
  const win = getWindow();
  const feats = practicesData.features.filter(f => {
    if (!win) return true;
    const d = new Date(f.properties.time_iso);
    const mins = d.getHours()*60 + d.getMinutes();
    return mins >= win[0] && mins < win[1];
  });

  if (layer) map.removeLayer(layer);
  layer = L.geoJSON({type:'FeatureCollection', features:feats}, {
    pointToLayer: (f, ll) => {
      const v = mode==='bourdieu' ? f.properties.bourdieu_field : f.properties.goffman_region;
      return L.circleMarker(ll, { radius:6, fillColor:colors[mode][v]||'#999', color:'#fff', weight:1, fillOpacity:0.9 });
    },
    onEachFeature: (f, l) => {
      const p = f.properties;
      const v = mode==='bourdieu' ? p.bourdieu_field : p.goffman_region;
      l.bindPopup('<b>'+shortName[mode][v]+'</b><br>'+(p.practice_raw||'')+'<br><small>'+p.time_iso.slice(11,16)+'</small>');
    }
  }).addTo(map);

  const lab = document.getElementById('time-label');
  if (!win) lab.textContent = 'Все наблюдения ('+feats.length+')';
  else lab.textContent = fmt(win[0]) + ' – ' + fmt(win[1]) + ' ('+feats.length+')';

  const counts = {};
  feats.forEach(f => {
    const v = mode==='bourdieu' ? f.properties.bourdieu_field : f.properties.goffman_region;
    counts[v] = (counts[v]||0)+1;
  });
  const keys = Object.keys(colors[mode]);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('pie'), {
    type:'pie',
    data:{ labels:keys.map(k=>shortName[mode][k]), datasets:[{ data:keys.map(k=>counts[k]||0), backgroundColor:keys.map(k=>colors[mode][k]) }] },
    options:{ plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:10} } } }, maintainAspectRatio:false }
  });

  let h = '<h4>Поля по Бурдьё</h4>';
  keys.forEach(k => {
    h += '<div class="leg-item"><div class="leg-dot" style="background:'+colors[mode][k]+'"></div><div><b>'+shortName[mode][k]+'</b> — '+fullDesc[mode][k]+'</div></div>';
  });
  h += '<div style="margin-top:8px;font-size:11px;color:#555;">Маршруты — оранжевые линии.</div>';
  document.getElementById('legend').innerHTML = h;
}

function setMode(m) {
  mode = 'bourdieu';
  update();
}
slider.oninput = update;
update();
map.fitBounds(L.geoJSON(routesData).getBounds().pad(0.12));
</script>
</body>
</html>
